# Reference only — Service Pros configures Workers manually via the
# Cloudflare dashboard, not the CLI. This file documents the bindings
# that must be set up there so the dashboard config matches.

name = "aventa-detailing-worker"
main = "index.js"
compatibility_date = "2024-09-01"

[[d1_databases]]
binding = "DB"
database_name = "detailing-bookings"
database_id = "REPLACE_WITH_SHARED_DATABASE_ID"

# Set as a secret via dashboard: Worker > Settings > Variables > Encrypt
# STRIPE_SECRET_KEY = "sk_live_..." (or sk_test_... in test mode)
